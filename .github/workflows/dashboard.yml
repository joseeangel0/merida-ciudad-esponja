name: Publicar dashboard en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "subtema_1_precipitacion/dashboard/**"
      - "booklet/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Juntar dashboard y booklet
        run: |
          mkdir _sitio
          cp -r subtema_1_precipitacion/dashboard/. _sitio/
          cp -r booklet _sitio/booklet
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
